// Set compileSdk 35 and fill a missing namespace for every Android plugin.
// Older plugins (e.g. qr_code_scanner) have no namespace, which AGP 8 requires.
subprojects {
    afterEvaluate { proj ->
        proj.tasks.matching { it.name.startsWith('compile') && it.name.contains('Kotlin') }.configureEach {
            if (it.hasProperty('kotlinOptions')) { it.kotlinOptions.jvmTarget = '17' }
        }
        def ext = proj.extensions.findByName('android')
        if (ext != null) {
            ext.compileSdk = 35
            ext.ndkVersion = "25.1.8937393"
            ext.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            ext.compileOptions.targetCompatibility = JavaVersion.VERSION_17
            if (ext.namespace == null) {
                def manifest = proj.file('src/main/AndroidManifest.xml')
                if (manifest.exists()) {
                    def m = (manifest.text =~ /package="([^"]+)"/)
                    if (m.find()) { ext.namespace = m.group(1) }
                }
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
