name: Build NewApp APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - name: Check Supabase secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing repository secret: SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --target-platform=android-arm64 --split-per-abi
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newapp-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
